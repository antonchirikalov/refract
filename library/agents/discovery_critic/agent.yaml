name: discovery_critic
version: 1
description: >
  Reviews a discovery report draft and emits a verdict@v1. The critic of the
  Discovery pipeline's refine loop: it judges whether the report honestly captures
  the open questions, unknowns, and risks, and returns approved or revise.
consumes:
  - { port: draft, type: discovery_report@v1 }
produces:
  - { port: verdict, type: verdict@v1 }
needs: [read]
defaults:
  timeout_s: 1800
