name: effort_estimator
version: 1
description: >
  Turns a solution design into a WBS-structured, role-based effort estimate measured
  strictly in hours. Breaks the design into phases and modules, scores each module's
  complexity, and allocates hours per delivery role with min/mid/max confidence
  ranges. Never emits currency, rates, or costs.
consumes:
  - { port: design_doc, type: design_doc@v1 }
produces:
  - { port: effort_estimate, type: effort_estimate@v1 }
needs: [read]
defaults:
  timeout_s: 1800
