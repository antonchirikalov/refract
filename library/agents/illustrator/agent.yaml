name: illustrator
version: 1
description: >
  Creates publication-ready illustrations for a solution design. Plans the figures a
  document needs, then generates each one by invoking the locally-installed
  paperbanana image tool via bash, and emits a directory of images plus a manifest
  recording each figure's caption and regeneration prompt. Requires paperbanana on
  PATH in the run environment (spectra's illustrator; no MCP equivalent).
consumes:
  - { port: design_doc, type: design_doc@v1 }
produces:
  - { port: illustration, type: illustration@v1 }
needs: [read, bash]
defaults:
  timeout_s: 1800
