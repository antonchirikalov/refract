name: word_form_builder
version: 1
description: >
  Builds an interactive Word (.docx) clarification form from a requirements document.
  Consolidates the integrations, conflicts, gaps, and assumptions into a structured
  set of client-fillable questions — confirmations, dropdowns, multi-selects, and
  tabular fields — and produces the finished .docx.
consumes:
  - { port: requirements, type: requirements@v1 }
produces:
  - { port: word_doc, type: word_doc@v1 }
needs: [read, "mcp:docx"]
defaults:
  timeout_s: 1800
