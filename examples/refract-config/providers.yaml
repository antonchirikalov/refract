# ~/.refract/providers.yaml  (copy to your $REFRACT_HOME, default ~/.refract)
#
# Registry of the providers (and their models) that pipelines can assign to agents.
# The key is the model-string prefix before "/". The API key itself never lives
# here — only the NAME of the env var that holds it (I8). `library_path` points
# refract at the agent/type library.

providers:
  # Built-in opencode provider — needs only the key env.
  openai:
    api_key_env: OPENAI_API_KEY
    max_concurrent: 4
    models: [gpt-5.6]

  # OpenAI-compatible provider. Custom providers also need the ai-sdk `npm`
  # package and `base_url`, plus an explicit `models` catalog. Pick base_url by
  # your key type:
  #   - Kimi For Coding plan (sk-kimi-… key): https://api.kimi.com/coding/v1
  #   - Moonshot platform key (sk-… key):     https://api.moonshot.ai/v1
  kimi:
    api_key_env: MOONSHOT_API_KEY
    max_concurrent: 4
    npm: "@ai-sdk/openai-compatible"
    base_url: "https://api.kimi.com/coding/v1"
    models: [k3, k3-256k, kimi-for-coding, kimi-for-coding-highspeed]

library_path: /absolute/path/to/refract/library
